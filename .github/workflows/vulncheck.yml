name: VulnCheck
on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  vulncheck:
    name: Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cached: false
      - name: Get official govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
        shell: bash
      - name: Run govulncheck
        run: |
          govulncheck -json ./... > vuln.json
          # symbol-level findings only (function set in the first trace frame)
          jq -r 'select(.finding != null and .finding.trace[0].function != null) | .finding.osv' vuln.json | sort -u > found.txt
          grep -v '^#' .govulncheck-allow | grep -v '^$' | sort > allow.txt || true
          grep -vxF -f allow.txt found.txt > blocking.txt || true
          if [ -s blocking.txt ]; then
            echo "Blocking vulnerabilities (not in .govulncheck-allow):"
            cat blocking.txt
            govulncheck -show verbose ./... || true
            exit 1
          fi
          echo "OK. Reachable-but-allowlisted IDs:"
          comm -12 allow.txt found.txt || true
        shell: bash
