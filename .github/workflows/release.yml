name: Release

on:
  push:
    tags:
      - "RELEASE.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # gen-ldflags must run on the host arch, not the target arch
          if [[ "${TAG}" == RELEASE.* ]]; then
            VERSION_TIME=$(echo "${TAG}" | sed 's#RELEASE\.\([0-9]\+\)-\([0-9]\+\)-\([0-9]\+\)T\([0-9]\+\)-\([0-9]\+\)-\([0-9]\+\)Z#\1-\2-\3T\4:\5:\6Z#')
            LDFLAGS=$(GOOS= GOARCH= MINIO_RELEASE=RELEASE go run buildscripts/gen-ldflags.go "${VERSION_TIME}")
          else
            LDFLAGS=$(GOOS= GOARCH= go run buildscripts/gen-ldflags.go)
          fi
          EXT=""
          [[ "${GOOS}" == "windows" ]] && EXT=".exe"
          OUT="openbucket-${GOOS}-${GOARCH}${EXT}"
          CGO_ENABLED=0 go build -tags kqueue -trimpath -ldflags "${LDFLAGS}" -o "${OUT}" .
          sha256sum "${OUT}" > "${OUT}.sha256sum"

      - uses: actions/upload-artifact@v4
        with:
          name: openbucket-${{ matrix.goos }}-${{ matrix.goarch }}
          path: openbucket-*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/RELEASE.')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/*.sha256sum > dist/CHECKSUMS.sha256
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OpenBucket ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*

  docker:
    name: Build and push container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Compute ldflags
        id: ldflags
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" == RELEASE.* ]]; then
            VERSION_TIME=$(echo "${TAG}" | sed 's#RELEASE\.\([0-9]\+\)-\([0-9]\+\)-\([0-9]\+\)T\([0-9]\+\)-\([0-9]\+\)-\([0-9]\+\)Z#\1-\2-\3T\4:\5:\6Z#')
            LDFLAGS=$(MINIO_RELEASE=RELEASE go run buildscripts/gen-ldflags.go "${VERSION_TIME}")
          else
            LDFLAGS=$(go run buildscripts/gen-ldflags.go)
          fi
          echo "ldflags=${LDFLAGS}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openbucket
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/RELEASE.') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            LDFLAGS=${{ steps.ldflags.outputs.ldflags }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
